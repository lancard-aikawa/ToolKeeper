[project]
name = "toolkeeper"
version = "0.2.0"
description = "Keep the tools on a Windows PC up to date: winget, choco, PHP, Ghostscript and Cygwin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
toolkeeper = "toolkeeper.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
