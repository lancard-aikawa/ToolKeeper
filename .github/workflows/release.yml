name: release

# タグを打つ = リリース。v<版> のタグを push すると、版の一致 (タグ・pyproject.toml・__init__.py) と
# CHANGELOG.md のその版の節を検査し、テストを通してから Release をそのまま公開する (下書きにしない)。
#   git tag v0.3.0 && git push origin v0.3.0
# 配るファイルは、ソースコード (GitHub が自動で付ける zip / tar.gz) と、Python の要らない exe の zip
# (ToolKeeper-<版>-win-x64.zip、design.md §9.3。RepoTether の「道具」がこれを入れる)。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # タグ名はスクリプトに埋め込まず、環境変数で渡して形を確かめてから使う (Actions の式の展開によるスクリプトの注入を防ぐ)
      - name: 版と CHANGELOG を検査し、本文を作る
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v[0-9A-Za-z.\-]+$') { throw "タグの形が違います: $env:TAG" }
          python .github/release_notes.py $env:TAG dist/release-body.md
          if ($LASTEXITCODE -ne 0) { throw "版か CHANGELOG が合っていません" }

      - name: テスト
        run: |
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { throw "テストが失敗しました" }
        env:
          PYTHONPATH: src

      # PyInstaller の版は uv.lock の build の組と同じにする (tests/test_scripts.py が検査する)
      - name: exe を固めて zip を作る
        id: exe
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller を入れられません" }
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller scripts/toolkeeper.spec
          if ($LASTEXITCODE -ne 0) { throw "exe を固められません" }
          python scripts/package_exe.py
          if ($LASTEXITCODE -ne 0) { throw "zip を作れません" }
          $zip = Get-ChildItem dist/ToolKeeper-*-win-x64.zip | Select-Object -First 1
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      # タグのページの「Release を作る」から先に空の Release ができていたら、新しく作らずにそこへ題と本文とファイルを入れる
      - name: Release を作って公開する
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.exe.outputs.zip }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v[0-9A-Za-z.\-]+$') { throw "タグの形が違います: $tag" }
          $title = 'ToolKeeper ' + ($tag -replace '^v', '')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag の Release は既にあるので、題と本文とファイルを入れて公開します"
            gh release upload $tag $env:ZIP --clobber
            if ($LASTEXITCODE -ne 0) { throw "ファイルを付けられません" }
            gh release edit $tag --title $title --notes-file dist/release-body.md --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Release を直せません" }
          } else {
            gh release create $tag $env:ZIP --title $title --notes-file dist/release-body.md --latest
            if ($LASTEXITCODE -ne 0) { throw "Release を作れません" }
          }
